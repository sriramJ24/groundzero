<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GroundZero Field Views</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* One page for the farm-call demo: a crop switch on top, each crop's own viewer below.
   Corn = viewer/field3d, vineyard = viewer/vineyard. Potato is shown as "coming" until its pass is ready. */
:root { --bg:#0f1411; --panel:#161d18; --panel-2:#1d2620; --fg:#e9ede6; --muted:#9aa79c; --line:#2b362e; --accent:#8fbf3c; color-scheme:dark;
  --display:"Newsreader", Georgia, serif; --ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#eef0ea; --panel:#fbfcf8; --panel-2:#f1f4ec; --fg:#1b231d; --muted:#5d6b60; --line:#d7ddd0; --accent:#4d7c0f; color-scheme:light; } }
:root[data-theme="light"] { --bg:#eef0ea; --panel:#fbfcf8; --panel-2:#f1f4ec; --fg:#1b231d; --muted:#5d6b60; --line:#d7ddd0; --accent:#4d7c0f; color-scheme:light; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.45 var(--ui); overflow:hidden; }
body { display:grid; grid-template-rows:auto minmax(0,1fr); height:100dvh; }
header { display:flex; align-items:center; gap:16px; padding:8px max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px)); padding-top:max(8px, env(safe-area-inset-top,0px)); background:var(--panel); border-bottom:1px solid var(--line); }
.brand { font-family:var(--display); font-size:21px; font-weight:500; white-space:nowrap; }
.brand small { font-family:var(--ui); font-size:12px; color:var(--muted); margin-left:8px; }
.seg { display:flex; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:3px; }
.seg button { background:none; border:0; color:var(--muted); font:500 13.5px var(--ui); padding:6px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.seg button[aria-pressed="true"] { background:var(--panel); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line); }
.seg button .soon { font-size:10.5px; font-weight:600; letter-spacing:.04em; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 6px; }
.seg button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.spacer { flex:1; }
.src { font-size:12px; color:var(--muted); white-space:nowrap; }
main { position:relative; min-height:0; }
iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
.coming { position:absolute; inset:0; display:grid; place-items:center; padding:24px; }
.coming .card { max-width:460px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px 24px; }
.coming h2 { font-family:var(--display); font-weight:500; font-size:24px; margin:0 0 8px; }
.coming p { color:var(--muted); margin:6px 0; }
@media (max-width:720px) {
  header { flex-wrap:wrap; gap:8px 12px; }
  .brand small, .src { display:none; }
  .seg { order:3; width:100%; } .seg button { flex:1; justify-content:center; padding:8px 6px; }
}
</style>
<header>
  <div class="brand">GroundZero<small>field views</small></div>
  <div class="seg" role="tablist" aria-label="Crop">
    <button role="tab" data-crop="corn">Corn</button>
    <button role="tab" data-crop="vineyard">Vineyard</button>
    <button role="tab" data-crop="potato">Potato <span class="soon">coming</span></button>
  </div>
  <div class="spacer"></div>
  <div class="src" id="src"></div>
</header>
<main id="main"></main>
<script>
const CROPS = {
  corn: { src: 'field3d/index.html', note: 'Real photos · UAV3DCrop, CC BY 4.0' },
  vineyard: { src: 'vineyard/index.html', note: 'Real photos · University of Lincoln BLT, CC BY 4.0' },
  potato: { note: '' },
};
const main = document.getElementById('main'), frames = {};
let cur = null;
function show(crop, inner = '') {
  if (!CROPS[crop]) crop = 'corn';
  cur = crop;
  document.querySelectorAll('.seg button').forEach(b => { const on = b.dataset.crop === crop; b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-selected', String(on)); });
  document.getElementById('src').textContent = CROPS[crop].note;
  for (const [k, f] of Object.entries(frames)) f.hidden = k !== crop;
  if (!frames[crop]) {
    let el;
    if (CROPS[crop].src) {
      el = document.createElement('iframe'); el.title = crop === 'corn' ? 'Corn field in 3D' : 'Vineyard row in 3D';
      el.allow = 'clipboard-write'; el.src = CROPS[crop].src + (inner ? '#' + inner : '');
    } else {
      el = document.createElement('div'); el.className = 'coming';
      el.innerHTML = `<div class="card"><h2>Potato is coming</h2><p>A potato field view is being prepared and will appear here, with the same 3D view, places to look and the photo behind each one.</p><p>It will be clearly labelled as simulated, because no open ground-level potato photos exist yet.</p></div>`;
    }
    frames[crop] = el; main.appendChild(el);
  }
  try { history.replaceState(null, '', '#crop=' + crop + (inner ? '&' + inner : '')); } catch {}
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => show(b.dataset.crop));
// #crop=vineyard&flag=2 opens that crop and passes the rest to its viewer
const q = new URLSearchParams(location.hash.slice(1)); const crop = q.get('crop') || 'corn'; q.delete('crop');
show(crop, q.toString());
</script>
