<style>
/* Layout: the field fills the screen; one panel on the right holds the plot list, accuracy check and plot evidence;

:root {

:root[data-theme="light"] { --bg: #eef0ea; --panel: #fbfcf8; --panel-2: #f1f4ec; --line: #d7ddd0; --fg: #1b231d; --muted: #5d6b60; --accent: #4d7c0f; --wheat: #8a6516; --flag: #c0661a; --tape: #8a6516; --photo: #4d7c0f; --grid: #e1e6da; color-scheme: light; }

.labels { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; background: color-mix(in srgb, var(--panel) 90%, transparent); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; font: 600 11.5px var(--ui); padding: 3px 9px; white-space: nowrap; cursor: pointer; }
.tag.on { background: var(--accent); color: #0f1411; border-color: var(--accent); }
.tag.flag { min-width: 24px; padding: 3px 7px; text-align: center; color: #1b130a; }
.tag.flag.open { background: #ff7a1a; border-color: #ff7a1a; }

.sheet-btn { display: none; }
@media (max-width: 480px) { .light { display: none; } .legend { width: 160px; } }
@media (pointer: coarse) {

}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- loading screen ----------
let lDone = 0; const lTotal = 6;
const step = (txt) => { lDone++; $('lbar').style.width = (100 * lDone / lTotal) + '%'; if (txt) $('lstep').textContent = txt; };
const getJSON = async (u) => (await fetch(u)).json();
const decodeU16 = (J) => { const raw = Uint8Array.from(atob(J.uint16_le_base64), (c) => c.charCodeAt(0)); const q = new Uint16Array(raw.buffer); return Float32Array.from(q, (v) => J.offset_m + v * J.scale_m); };

// everything the first view needs is requested at once; the height grids, the sharper day-40 photo and
// the next dates are fetched after the field is on screen
const pScene = getJSON('scene.json'), pSea = getJSON('season/season.json'), pFlags = getJSON('flags/flags.json').catch(() => null);
const pWide = Promise.all([getJSON('wide/wide.json'), getJSON('wide/wide_heights.json'), fetch('wide/wide_texture.jpg').then((r) => r.blob())]);
const pFirst = Promise.all([getJSON('season/s_040.json'), fetch('season/tex_040.jpg').then((r) => r.blob())]);
const S = await pScene; step('Loading the season…');
const SEA = await pSea; step('Loading the surface…');
const FL = await pFlags;
const DAYS = SEA.days, CHECK = SEA.height_check;
const G = S.grid;
const cx = (G.x0 + G.x1) / 2, cy = (G.y0 + G.y1) / 2, GZ = S.ground_z;
// scene frame: X east, Y up (0 = estimated ground), Z south
const toV = (x, y, z) => new THREE.Vector3(x - cx, z - GZ, -(y - cy));
const W = G.x1 - G.x0, D = G.y1 - G.y0;
const dayNum = (d) => String(+d);

// ---------- renderer, scene, sky ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
const coarse = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.5 : 2)); // phones: fewer pixels, smoother orbit
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#d8e2e6', 70, 330);
const camera = new THREE.PerspectiveCamera(40, 1, 0.15, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 1.5; controls.maxDistance = 260;

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vD;
    void main(){ float h = max(vD.y, 0.0); vec3 c = mix(hor, top, pow(h, 0.55));
      float s = max(dot(normalize(vD), normalize(sunDir)), 0.0);
      c += sunCol * (pow(s, 900.0) * 1.4 + pow(s, 12.0) * 0.22);
      if (vD.y < 0.0) c = hor * 0.92;
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), skyMat); scene.add(sky);
const hemi = new THREE.HemisphereLight('#f4f1e6', '#5b4a35', 1.8); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4dc', 1.5);
sun.castShadow = true; const small = matchMedia('(max-width: 820px)').matches; sun.shadow.mapSize.setScalar(small ? 2048 : 4096); sun.shadow.radius = 4; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 160 });
scene.add(sun, sun.target);
const C = (h) => new THREE.Color(h);
function setTime(h) {
  // a mid-latitude summer day: sunrise 6:00, sunset 20:00, sun 65 degrees up at 13:00
  const el = THREE.MathUtils.degToRad(Math.max(-4, 65 * Math.sin(Math.PI * (h - 6) / 14)));
  const az = THREE.MathUtils.degToRad(90 + 180 * (h - 6) / 14);
  const dir = new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az));
  const k = THREE.MathUtils.clamp(Math.sin(el) / Math.sin(THREE.MathUtils.degToRad(35)), 0, 1); // 0 at horizon, 1 above 35 degrees
  const top = C('#2c3a5a').lerp(C('#5d8fc6'), k), hor = C('#f0b27c').lerp(C('#dfe8ec'), k);
  skyMat.uniforms.top.value.copy(top); skyMat.uniforms.hor.value.copy(hor); skyMat.uniforms.sunDir.value.copy(dir);
  skyMat.uniforms.sunCol.value.copy(C('#ffb36b').lerp(C('#fff6e0'), k));
  scene.fog.color.copy(hor);
  sun.position.copy(dir).multiplyScalar(80); sun.target.position.set(0, 0, 0);
  sun.color.copy(C('#ffb070').lerp(C('#fff4dc'), k)); sun.intensity = 0.25 + 1.35 * Math.min(1, Math.sin(Math.max(el, 0)) * 2.2);
  hemi.intensity = 0.9 + 1.0 * k; hemi.color.copy(C('#f3c9a0').lerp(C('#f4f1e6'), k));
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  $('todv').textContent = `${hh}:${String(mm).padStart(2, '0')}`;
}
$('tod').oninput = (e) => setTime(+e.target.value); setTime(10.5);

// soil beyond the surveyed area (plain color, not data)
const soil = new THREE.Mesh(new THREE.CircleGeometry(900, 64), new THREE.MeshLambertMaterial({ color: '#8a8660' }));
soil.rotation.x = -Math.PI / 2; soil.position.y = -0.25; soil.receiveShadow = true; scene.add(soil);

let splat = null, splatOn = false, splatMeta = null;
async function toggleSplat(on) {
  splatOn = on; pressView(on ? 'v-splat' : 'v-over');
  if (on && day !== '040') await setDay('040');
  if (on && !splat) {
    banner.innerHTML = 'Loading the photoreal model…'; banner.hidden = false;
    const [GS, J] = await Promise.all([import('https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js'), getJSON('splat/section_splat.json')]);
    splatMeta = J;
    const bytes = Uint8Array.from(atob(J.splat_base64), (c) => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
    splat = new GS.DropInViewer({ sharedMemoryForWorkers: false, gpuAcceleratedSort: false, integerBasedSort: false });
    await splat.addSplatScene(url, { format: GS.SceneFormat.Splat, showLoadingUI: false, splatAlphaRemovalThreshold: 8 });
    scene.add(splat);
  }
  if (splat) splat.visible = splatOn;
  field.visible = walls.visible = !splatOn; wide.visible = !splatOn && day === '040';
  if (splatOn) {
    banner.innerHTML = `<b>Photoreal view.</b> ${(splatMeta.count / 1000).toFixed(0)}k Gaussian splats trained on this computer from the day-40 photos. Section only; a short CPU run, so expect soft spots.`; banner.hidden = false;
    flyTo(new THREE.Vector3(9, 6, 13), new THREE.Vector3(0, 1.2, 0), 1500);
  } else if (!pass) banner.hidden = true;
}
fetch('splat/section_splat.json', { method: 'HEAD' }).then((r) => { if (r.ok) $('v-splat').hidden = false; }).catch(() => {});
$('v-splat').onclick = () => toggleSplat(!splatOn);
for (const id of ['v-field', 'v-over', 'v-cam']) $(id).addEventListener('click', () => { if (splatOn) toggleSplat(false).then(() => pressView(id)); });
dayInput.addEventListener('input', () => { if (splatOn) toggleSplat(false); });

// ---------- guided tour ----------
const TOUR = [
  { t: 'A real corn field, rebuilt in 3D', x: 'Everything you see on the ground was rebuilt from drone photos of a real field on survey day 40. The whole surveyed field is about 57 by 67 metres.', go: () => { stopPlay(); endPass(false); setCams(1); if (flagsOn) setFlags(false); setDay('040'); mode = 'photo'; applyMode(); select(null, false); goView('field'); } },
  { t: 'Six plots, measured by hand', x: 'The detailed section in the middle holds six plots where people measured height and leaf area on the same days the drone flew. They are our ground truth.', go: () => goView('over') },
  { t: 'Where PivotCam would sit', x: 'A camera on the pivot span, tilted 35° down, sees a strip of canopy a few metres ahead. The span, towers and camera are drawn models; the yellow outline is what the camera would see.', go: () => goView('cam') },
  { t: 'One pass of the pivot', x: 'As the span moves, each camera sweeps a strip and photographs the plots it passes. One camera covers only a strip, so this run uses the 3-camera what-if. A simulation on top of the real field.', go: () => { setCams(3); startPass(); } },
  { t: 'The whole season', x: 'Twelve flights from bare soil to full height. Colored by measured crop height on one fixed scale, the field fills in from pale to deep green.', go: () => { if (pass) endPass(false); mode = 'height'; setDay('007').then(() => { goView('over'); startPlay(); }); } },
  { t: 'Checked against a tape measure', x: 'Photo height tracks hand measurements across the season (66 plot visits, R² 0.95) and reads about 15 cm low. It cannot yet rank plots within one date. The chart on the right has the details.', go: () => { stopPlay(); side.scrollTop = 0; select(null, false); setTimeout(() => side.querySelector('.card')?.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }), 50); } },
  { t: 'Crop flags: where to walk', x: 'On day 28 the photos show where more soil shows through than in the rest of the section, which can mean a thinner stand. Found from photo colors alone, no training. Numbered flags open a 3 × 3 m photo of the spot. They are places to look, not diagnoses.', go: () => { stopPlay(); mode = 'photo'; setDay('028').then(() => { setFlags(true); flyTo(new THREE.Vector3(10, 16, 18), new THREE.Vector3(0, 0.5, 0)); }); } },
  { t: 'Evidence for each plot', x: 'Click any plot to see its numbers for the date on screen, its growth curve, and the original photo. Crop condition stays "not assessed" until a method is tested.', go: () => { mode = 'photo'; endPass(false); setFlags(false); setDay('040').then(() => select('Corn-3')); } },
];
let tourI = -1;
function showTour(i) {
  tourI = i; const s = TOUR[i]; const el = $('tour'); el.hidden = false;
  el.innerHTML = `<div class="eyebrow">Guided tour · ${i + 1} of ${TOUR.length}</div><h3>${s.t}</h3><p>${s.x}</p><div class="row"><button id="tq">Exit</button><span style="display:flex;gap:8px">${i ? '<button id="tp">Back</button>' : ''}<button class="pri" id="tn">${i + 1 < TOUR.length ? 'Next' : 'Finish'}</button></span></div>`;
  $('tq').onclick = endTour; if (i) $('tp').onclick = () => showTour(i - 1);
  $('tn').onclick = () => i + 1 < TOUR.length ? showTour(i + 1) : endTour();
  s.go();
}
function endTour() { tourI = -1; $('tour').hidden = true; }
$('t-tour').onclick = () => showTour(0);

renderer.domElement.addEventListener('pointerdown', () => { anim = null; });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('dlg').open) { if (tourI >= 0) endTour(); else select(null); } });

function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const v = new THREE.Vector3();
function frame(now) {
  if (anim) { const k = anim.ms ? Math.min(1, (now - anim.start) / anim.ms) : 1; const e = k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2; camera.position.lerpVectors(anim.p0, anim.p, e); controls.target.lerpVectors(anim.t0, anim.t, e); if (k >= 1) anim = null; }
  if (pass) passFrame(now);
  camTagV.copy(camWorld()).add(new THREE.Vector3(0, 0.55, 0)); towerTagV.set(X_A, PIPE_Y + 0.6, SPAN_Z + pivot.position.z);
  sky.position.copy(camera.position);
  controls.update(); renderer.render(scene, camera);
  const r = renderer.domElement.getBoundingClientRect();
  for (const t of tags) { v.copy(t.v3).project(camera); const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05; t.el.style.display = vis && !t.el.hidden ? '' : 'none'; t.el.style.left = ((v.x + 1) / 2 * r.width) + 'px'; t.el.style.top = ((1 - v.y) / 2 * r.height) + 'px'; }
  requestAnimationFrame(frame);
}
// ---------- shareable link: the date, layers, selection and camera live in the address after # ----------
let saveT = null;
function stateParams() {
  const f = (v) => v.toFixed(2).replace(/\.?0+$/, '');
  const q = new URLSearchParams({ d: dayNum(day) });
  if (mode !== 'photo') q.set('m', mode);
  if (flagsOn) q.set('flags', '1');
  if (nCams === 3) q.set('cams', '3');
  if (!pivot.visible) q.set('pivot', '0');
  if (selected) q.set('plot', selected.replace('Corn-', ''));
  else if (sideView === 'flag') { const on = flagTags.findIndex((t) => t.el.classList.contains('on')); if (on >= 0) q.set('flag', String(on + 1)); }
  const tp = anim ? anim.p : camera.position, tt = anim ? anim.t : controls.target;
  q.set('cam', [tp.x, tp.y, tp.z, tt.x, tt.y, tt.z].map(f).join(','));
  return q;
}
function saveState() {
  if (!booted) return; clearTimeout(saveT);
  saveT = setTimeout(() => { try { history.replaceState(null, '', '#' + stateParams().toString().replace(/%2C/g, ',')); } catch {} }, 250);
}
controls.addEventListener('end', saveState);
$('t-share').onclick = async () => {
  clearTimeout(saveT); const url = location.href.split('#')[0] + '#' + stateParams().toString().replace(/%2C/g, ',');
  try { history.replaceState(null, '', url); } catch {}
  let ok = false; try { await navigator.clipboard.writeText(url); ok = true; } catch {}
  banner.innerHTML = ok ? '<b>Link copied.</b> It opens this date, these layers and this exact camera view.' : `Copy this link: <span class="num" style="user-select:all">${url}</span>`;
  banner.hidden = false; clearTimeout(banner._t); banner._t = setTimeout(() => { if (!pass && !splatOn) banner.hidden = true; }, ok ? 3500 : 12000);
};
function readState() {
  const q = new URLSearchParams(location.hash.slice(1)); const out = {};
  const d = q.get('d') && String(q.get('d')).padStart(3, '0'); if (d && DAYS.includes(d)) out.day = d;
  if (['height', 'green'].includes(q.get('m'))) out.mode = q.get('m');
  out.flags = q.get('flags') === '1'; out.cams = q.get('cams') === '3' ? 3 : 1; out.pivot = q.get('pivot') !== '0';
  if (q.get('plot') && S.plots.some((p) => p.id === 'Corn-' + q.get('plot'))) out.plot = 'Corn-' + q.get('plot');
  if (q.get('flag')) out.flag = +q.get('flag');
  const c = (q.get('cam') || '').split(',').map(Number); if (c.length === 6 && c.every(Number.isFinite)) out.cam = c;
  return out;
}

// ---------- phones: the panel is a sheet under the field that opens for details ----------
const app = $('app'); const narrow = matchMedia('(max-width: 820px)');
function openSheet() { if (narrow.matches) { app.classList.add('sheet'); side.scrollTop = 0; } }
$('sheetBtn').onclick = () => { app.classList.toggle('sheet'); side.scrollTop = 0; };

step('Ready');
const ST = readState();
camera.position.copy(VIEWS.field.p).multiplyScalar(1.6); controls.target.copy(VIEWS.field.t);
if (ST.mode) mode = ST.mode;
flagsOn = ST.flags; $('t-flags').setAttribute('aria-pressed', String(flagsOn)); setCams(ST.cams);
if (!ST.pivot) { pivot.visible = false; $('t-pivot').setAttribute('aria-pressed', 'false'); camTag.hidden = towerTag.hidden = true; }
await setDay(ST.day || '040');
if (ST.plot) select(ST.plot, false); else select(null);
if (ST.flag) { const f = FL?.dates[day]?.flags.filter((q) => q.crop)[ST.flag - 1]; if (f) selectFlag(f.id); }
requestAnimationFrame(frame);
$('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 650);
if (ST.cam) { anim = null; camera.position.set(ST.cam[0], ST.cam[1], ST.cam[2]); controls.target.set(ST.cam[3], ST.cam[4], ST.cam[5]); pressView(null); }
else { flyTo(VIEWS.over.p, VIEWS.over.t, reduced ? 0 : 3200); pressView('v-over'); }
booted = true; saveState();
// after the first view is up: the sharper day-40 photo, then the next date
setTimeout(() => { loadHires(); const i = DAYS.indexOf(day); if (i + 1 < DAYS.length) dayData(DAYS[i + 1]); }, 400);
</script>
