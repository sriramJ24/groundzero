<style>
/* Layout: the field fills the screen; one panel on the right holds the plot list, accuracy check and plot evidence;
   the season timeline and view controls float along the bottom of the 3D view. */
:root {
  --bg: #0f1411; --panel: #161d18; --panel-2: #1d2620; --line: #2b362e;
  --fg: #e9ede6; --muted: #9aa79c; --accent: #8fbf3c; --wheat: #d9b86c; --flag: #e8903a;
  --tape: #d9b86c; --photo: #8fbf3c; --grid: #2b362e;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef0ea; --panel: #fbfcf8; --panel-2: #f1f4ec; --line: #d7ddd0; --fg: #1b231d; --muted: #5d6b60; --accent: #4d7c0f; --wheat: #8a6516; --flag: #c0661a; --tape: #8a6516; --photo: #4d7c0f; --grid: #e1e6da; color-scheme: light; } }
:root[data-theme="light"] { --bg: #eef0ea; --panel: #fbfcf8; --panel-2: #f1f4ec; --line: #d7ddd0; --fg: #1b231d; --muted: #5d6b60; --accent: #4d7c0f; --wheat: #8a6516; --flag: #c0661a; --tape: #8a6516; --photo: #4d7c0f; --grid: #e1e6da; color-scheme: light; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; overflow: hidden; margin: 0; }
#app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 380px; }
#stage { position: relative; min-width: 0; overflow: hidden; background: #a9bccb; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 18px 24px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 500; font-size: 21px; margin: 0; }
h3 { font-family: var(--display); font-weight: 500; font-size: 18px; margin: 0 0 4px; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 4px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.real { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.chip.model { color: var(--wheat); border-color: color-mix(in srgb, var(--wheat) 45%, transparent); }
.list { display: grid; gap: 6px; }
.plot-btn { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 6px 6px; color: var(--fg); font: inherit; cursor: pointer; }
.plot-btn:hover, .plot-btn.on { border-color: var(--accent); }
.plot-btn img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; display: block; }
.plot-btn .n { font-weight: 600; font-size: 13px; }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.stat .v { font-family: var(--mono); font-size: 20px; }
.stats.four .stat .v { font-size: 17px; }
.stat .k { font-size: 11px; color: var(--muted); }

.evidence { display: grid; gap: 8px; }
.evidence img { width: 100%; border-radius: 10px; display: block; cursor: zoom-in; border: 1px solid var(--line); }
.note { font-size: 12px; line-height: 1.5; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.note b { color: var(--fg); font-weight: 600; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 10.5px var(--ui); fill: var(--muted); }
.chart .ax { stroke: var(--line); }
.chart .gl { stroke: var(--grid); }
.key { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.key i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
button.lnk { background: none; border: 0; color: var(--accent); font: inherit; font-size: 12.5px; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass { background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.bottom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.timeline { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; border-radius: 16px; padding: 8px 14px 6px 8px; }
.play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: #0f1411; cursor: pointer; display: grid; place-items: center; }
.play svg { width: 14px; height: 14px; }
.tl-track { position: relative; padding-bottom: 16px; min-width: 0; }
.tl-track input { width: 100%; margin: 0; accent-color: var(--accent); }
.ticks { position: absolute; left: 8px; right: 8px; bottom: 0; height: 14px; font: 10px var(--mono); color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span.on { color: var(--fg); font-weight: 500; }
.tl-read { text-align: right; min-width: 132px; }
.tl-read .d { font-family: var(--display); font-size: 18px; line-height: 1.1; }
.tl-read .m { font-size: 11px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; border-radius: 999px; padding: 3px; }
.seg button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12.5px; padding: 6px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.seg button.go { color: var(--wheat); }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; border-radius: 12px; padding: 10px 12px; width: 250px; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.legend .t { color: var(--fg); font-weight: 600; }
.ramp { height: 8px; border-radius: 4px; margin: 6px 0 4px; }
.light { position: absolute; right: 12px; top: 12px; border-radius: 999px; padding: 5px 12px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.light input { width: 110px; accent-color: var(--wheat); }
.labels { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; background: color-mix(in srgb, var(--panel) 90%, transparent); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; font: 600 11.5px var(--ui); padding: 3px 9px; white-space: nowrap; cursor: pointer; }
.tag.on { background: var(--accent); color: #0f1411; border-color: var(--accent); }
.tag.hw { cursor: default; color: var(--wheat); font-weight: 500; }
.tag.cap { background: var(--flag); color: #1b130a; border-color: var(--flag); animation: pop .35s ease-out; }

.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); border-radius: 999px; padding: 6px 14px; font-size: 12px; color: var(--fg); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }

.tour { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: min(440px, calc(100% - 24px)); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }

.tour .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tour .row button { background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 12.5px; cursor: pointer; }
.tour .row button.pri { background: var(--accent); color: #0f1411; border-color: var(--accent); }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 30%, #2a3a2c, #0f1411 70%); color: #e9ede6; z-index: 5; transition: opacity .6s; }
#loading .box { width: min(360px, 80%); display: grid; gap: 12px; }
#loading .t { font-family: var(--display); font-size: 28px; line-height: 1.1; }
#loading .bar { height: 4px; background: #2b362e; border-radius: 2px; overflow: hidden; }
#loading .bar div { height: 100%; width: 0; background: #8fbf3c; transition: width .3s; }
#loading .s { font-size: 12px; color: #9aa79c; }
dialog { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 14px; padding: 0; max-width: min(1100px, 94vw); }
dialog::backdrop { background: rgba(0,0,0,.7); }
dialog img { display: block; max-width: 100%; max-height: 78vh; }
dialog .cap { padding: 10px 14px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
dialog .cap button { background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 64vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .legend { width: 190px; font-size: 10.5px; padding: 8px 10px; }
  .legend .x { display: none; }
  .light input { width: 70px; }
  .tl-read { min-width: 0; }
  .tl-read .m { display: none; }
  .ticks span:nth-child(even) { display: none; }
  .seg button { padding: 5px 9px; font-size: 12px; }
  .tour { top: 52px; padding: 10px 12px; gap: 6px; }
  .tour p { font-size: 12px; }
  .tour h3 { font-size: 16px; }
  .controls { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -12px; padding-right: 12px; }
  .controls::-webkit-scrollbar { display: none; }
  .seg { flex: none; }
  .light span:first-child { display: none; }
  .banner { top: auto; bottom: 120px; white-space: normal; border-radius: 12px; font-size: 11.5px; width: calc(100% - 24px); }
  .legend { top: 52px; }
}

  <div id="stage">

</div>

<script type="module">

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- loading screen ----------
let lDone = 0; const lTotal = 6;
const step = (txt) => { lDone++; $('lbar').style.width = (100 * lDone / lTotal) + '%'; if (txt) $('lstep').textContent = txt; };
const getJSON = async (u) => (await fetch(u)).json();

const S = await getJSON('scene.json'); step('Loading the season…');
const SEA = await getJSON('season/season.json'); step('Loading the surface…');

const G = S.grid;
const cx = (G.x0 + G.x1) / 2, cy = (G.y0 + G.y1) / 2, GZ = S.ground_z;

// ---------- renderer, scene, sky ----------
const stage = $('stage');

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vD;

const sun = new THREE.DirectionalLight('#fff4dc', 1.5);

const C = (h) => new THREE.Color(h);
function setTime(h) {
  // a mid-latitude summer day: sunrise 6:00, sunset 20:00, sun 65 degrees up at 13:00
  const el = THREE.MathUtils.degToRad(Math.max(-4, 65 * Math.sin(Math.PI * (h - 6) / 14)));
  const az = THREE.MathUtils.degToRad(90 + 180 * (h - 6) / 14);

}
$('tod').oninput = (e) => setTime(+e.target.value); setTime(10.5);

// soil beyond the surveyed area (plain color, not data)
const soil = new THREE.Mesh(new THREE.CircleGeometry(900, 64), new THREE.MeshLambertMaterial({ color: '#8a8660' }));
soil.rotation.x = -Math.PI / 2; soil.position.y = -0.25; soil.receiveShadow = true; scene.add(soil);

const texLoader = new THREE.TextureLoader();
const loadTex = async (u) => { const t = await texLoader.loadAsync(u); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
const cache = {};
function dayData(d) {
  if (!cache[d]) cache[d] = (async () => {
    const [sj, tex, hj] = await Promise.all([getJSON(`season/s_${d}.json`), loadTex(`season/tex_${d}.jpg`), d === SEA.ground_day ? null : getJSON(`season/h_${d}.json`)]);

let day = '040';
const first = await dayData(day); step('Loading the whole field…');
const geo = new THREE.PlaneGeometry(W, D, G.nx - 1, G.ny - 1); geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;

  for (let r = 0; r < G.ny; r++) for (let c = 0; c < G.nx; c++) pos.setY(r * G.nx + c, surf[(G.ny - 1 - r) * G.nx + c] - GZ);

applySurface(first.surf);

const field = new THREE.Mesh(geo, fieldMat); field.receiveShadow = true; field.castShadow = true; scene.add(field);

const walls = new THREE.Group(); scene.add(walls);
function edgeWall(points) {
  const g = new THREE.BufferGeometry(); const v = [], col = [];
  const top = C('#3e5a24'), bot = C('#5a4630');

    <button class="lnk" id="back">← All plots</button>
    <div><div class="eyebrow">Measured plot · day ${dayNum(day)}</div><h2>${p.id.replace('Corn-', 'Plot ')}</h2>
    <p class="sub">2025 season · position <span class="num">${p.x.toFixed(1)} m E, ${p.y.toFixed(1)} m N</span> of the survey origin</p></div>
    <div class="stats">
      <div class="stat"><div class="k">Canopy height, tape</div><div class="v">${fmt(r.hand_cm)}<span style="font-size:12px"> cm</span></div><div class="s">${r.hand_cm == null ? 'Not measured this date' : 'Mean of 5 readings' + (r.day_offset ? `, ${Math.abs(r.day_offset)} day ${r.day_offset > 0 ? 'after' : 'before'} the flight` : '')}</div></div>
      <div class="stat"><div class="k">Canopy height, photos</div><div class="v">${day === SEA.ground_day ? '—' : fmt(r.photo_cm)}<span style="font-size:12px"> cm</span></div><div class="s">${day === SEA.ground_day ? 'This date is the bare-soil reference' : 'Top of canopy within 1 m, from the 3D surface'}</div></div>
      <div class="stat"><div class="k">Leaf area index</div><div class="v">${fmt(r.lai, 2)}</div><div class="s">LAI-2200C, m² leaf per m² ground</div></div>
      <div class="stat"><div class="k">Crop condition</div><div class="v" style="font-size:16px;font-family:var(--ui)">Not assessed</div><div class="s">No tested method yet</div></div>
    </div>
    <div class="card"><h3>Height through the season</h3><div class="key"><span><i style="border-color:var(--tape)"></i>Tape measure</span><span><i style="border-color:var(--photo);border-top-style:dashed"></i>From photos</span></div>${growthSVG(p.id)}</div>
    <div class="evidence"><div class="eyebrow">Evidence · day 40</div>
      <img src="${p.crop}" alt="Top-down photo of ${p.id}, 3 by 3 metres" data-cap="${p.id} on day 40: 3 × 3 m from the orthophoto, 1 cm per pixel">
      <img src="${p.photo}" alt="Original drone photo ${p.photo_id}" data-cap="Original photo ${p.photo_id} from day 40, taken straight down from about 18 m (downscaled). The camera was ${p.photo_offset_m} m from the plot.">
      <p class="sub">Day 40 photo greenness: ${rank}th percentile of the section. ${rank < 25 ? 'Lighter than most of the section, which can come from leaf angle, light or soil showing through. A reason to look, not a finding.' : 'Within the usual range for the section.'}</p>
    </div>`;
  $('back').onclick = () => select(null);
  side.querySelectorAll('.evidence img').forEach((im) => im.onclick = () => { $('dlg-img').src = im.src; $('dlg-cap').textContent = im.dataset.cap; $('dlg').showModal(); });
}
$('dlg-close').onclick = () => $('dlg').close();
$('dlg').onclick = (e) => { if (e.target === $('dlg')) $('dlg').close(); };
function select(id, fly = true) {
  selected = id;
  for (const [k, m] of Object.entries(plotMarks)) { m.tag.classList.toggle('on', k === id); m.ring.material.color.set(k === id ? '#8fbf3c' : '#f3efe2'); }
  if (id) { detail(S.plots.find((q) => q.id === id)); if (fly) flyTo(plotMarks[id].top.clone().add(new THREE.Vector3(5, 7, 9)), plotMarks[id].top.clone().add(new THREE.Vector3(0, -1.2, 0))); }
  else overview();
}
const refreshSide = () => selected ? select(selected, false) : overview();

// ---------- coloring ----------
let mode = 'photo';
const legend = $('legend');
async function applyMode() {
  const dd = await dayData(day);
  for (const b of ['photo', 'height', 'green']) $('m-' + b).setAttribute('aria-pressed', String(b === mode));
  if (mode === 'height') {
    if (!dd.hTex) dd.hTex = heightTexture(dd.hgt);
    fieldMat.map = dd.hTex;
    legend.innerHTML = `<div class="t">Crop height · day ${dayNum(day)}</div><div class="ramp" style="background:linear-gradient(90deg,${hStops.map((c) => '#' + c.getHexString()).join(',')})"></div><div class="num" style="display:flex;justify-content:space-between"><span>0</span><span>100</span><span>200</span><span>300 cm</span></div><div class="x" style="margin-top:6px">Measured from the photos: canopy surface on this date minus the bare-soil surface of day 7, in 4 cm squares. Same scale on every date.</div>`;
  } else if (mode === 'green') {
    fieldMat.map = gTex;
    legend.innerHTML = `<div class="t">Photo greenness · day 40</div><div class="ramp" style="background:linear-gradient(90deg,#b8743a,#d9c46a,#6fae3a,#1f6b2a)"></div><div style="display:flex;justify-content:space-between"><span>lighter / yellower</span><span>deeper green</span></div><div class="x" style="margin-top:6px">Color measured from the photos in 0.5 m squares. Orange squares are the lightest 3% of this section. It shows where to look, not what is wrong.</div>`;
  } else fieldMat.map = day === '040' && hiresDay40 ? hiresDay40 : dd.tex;
  legend.hidden = mode === 'photo'; fieldMat.needsUpdate = true;
}
$('m-photo').onclick = () => { mode = 'photo'; applyMode(); };
$('m-height').onclick = () => { mode = 'height'; applyMode(); };
$('m-green').onclick = () => { if (day !== '040') return; mode = 'green'; applyMode(); };

// ---------- season timeline ----------
const dayInput = $('day');
$('ticks').innerHTML = DAYS.map((d, i) => `<span style="left:${100 * i / (DAYS.length - 1)}%">${dayNum(d)}</span>`).join('');
let dayToken = 0;
async function setDay(d) {
  const tok = ++dayToken; day = d;
  dayInput.value = DAYS.indexOf(d);
  $('ticks').querySelectorAll('span').forEach((s, i) => s.classList.toggle('on', DAYS[i] === d));
  $('dayLabel').textContent = `Day ${dayNum(d)}`;
  const mean = SEA.dates[d].mean_photo_cm;
  $('dayMean').textContent = d === SEA.ground_day ? 'Bare soil, the height reference' : `Section average ${Math.round(mean)} cm tall`;
  const dd = await dayData(d); if (tok !== dayToken) return;
  applySurface(dd.surf); placePlots(dd.surf);
  const isWide = d === '040'; wide.visible = isWide; walls.visible = !isWide; if (!isWide) rebuildWalls();
  $('m-green').disabled = !isWide; $('m-green').title = isWide ? '' : 'Measured on day 40 only';
  if (mode === 'green' && !isWide) mode = 'photo';
  await applyMode(); refreshSide();
  const i = DAYS.indexOf(d); if (i + 1 < DAYS.length) dayData(DAYS[i + 1]); // preload the next date
}
dayInput.oninput = () => { stopPlay(); setDay(DAYS[+dayInput.value]); };
const PLAY = '<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>', PAUSE = '<svg viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/><rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/></svg>';
let playTimer = null;
function stopPlay() { clearTimeout(playTimer); playTimer = null; $('play').innerHTML = PLAY; $('play').setAttribute('aria-label', 'Play the season'); }
async function playStep(onEnd) {
  const i = DAYS.indexOf(day); if (i + 1 >= DAYS.length) { stopPlay(); onEnd?.(); return; }
  await setDay(DAYS[i + 1]); if (playTimer !== null) playTimer = setTimeout(() => playStep(onEnd), 1300);
}
function startPlay(onEnd) { if (DAYS.indexOf(day) === DAYS.length - 1) setDay(DAYS[0]); $('play').innerHTML = PAUSE; $('play').setAttribute('aria-label', 'Pause'); playTimer = setTimeout(() => playStep(onEnd), 900); }
$('play').onclick = () => playTimer !== null ? stopPlay() : startPlay();
stopPlay();

// ---------- simulated pivot pass ----------
const PASS_Z0 = -D / 2 - 9 - SPAN_Z, PASS_Z1 = D / 2 - 1 - SPAN_Z, PASS_MS = 22000;
let pass = null; const capTags = [];
const banner = $('banner');
function quadContains(q, x, z) { let s = 0; for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i + 1) % 4]; const c = (b.x - a.x) * (z - a.z) - (b.z - a.z) * (x - a.x); if (c !== 0) { if (s && Math.sign(c) !== s) return false; s = Math.sign(c); } } return true; }
function startPass() {
  stopPlay(); if (day !== '040') setDay('040');
  pivot.visible = true; $('t-pivot').setAttribute('aria-pressed', 'true'); camTag.hidden = towerTag.hidden = false;
  covCtx.clearRect(0, 0, covCv.width, covCv.height); covTex.needsUpdate = true; cover.visible = true;
  capTags.forEach((t) => { t.el.remove(); tags.splice(tags.indexOf(t), 1); }); capTags.length = 0;
  pass = { start: performance.now(), got: new Set() };
  banner.innerHTML = '<b>Simulation.</b> How PivotCam would sweep this section as the span moves (sped up). The field is real; the pass is not.'; banner.hidden = false;
  $('t-pass').textContent = 'Stop pass';
  flyTo(new THREE.Vector3(-24, 17, 26), new THREE.Vector3(0, 1, 0), 1500);
}
function endPass(keep = true) {
  pass = null; $('t-pass').textContent = 'Run a pass';
  if (!keep) { cover.visible = false; banner.hidden = true; pivot.position.z = 0; capTags.forEach((t) => { t.el.remove(); tags.splice(tags.indexOf(t), 1); }); capTags.length = 0; }
  else {
    const a = covCtx.getImageData(0, 0, covCv.width, covCv.height).data; let n = 0; for (let i = 3; i < a.length; i += 4) if (a[i] > 0) n++;
    const pct = Math.round(100 * n / (covCv.width * covCv.height));
    banner.innerHTML = `<b>Simulated pass done.</b> ${nCams === 1 ? 'One camera' : 'Three cameras'} saw ${pct}% of this section and ${capTags.length} of 6 plots.${nCams === 1 ? ' Try 3 cameras.' : ''}`;
  }
}
function passFrame(now) {
  const k = Math.min(1, (now - pass.start) / (reduced ? 1 : PASS_MS));
  const pz = PASS_Z0 + (PASS_Z1 - PASS_Z0) * k; const dz = pz - pivot.position.z; pivot.position.z = pz;
  for (const w of wheels) w.rotation.x += dz / 0.72;
  const quads = activeCams().map((cam) => cam.corners.map((c) => new THREE.Vector3(c.x, c.y, c.z + pz)));
  covCtx.fillStyle = 'rgba(255, 196, 80, 0.10)';
  for (const q of quads) { covCtx.beginPath(); q.forEach((p, i) => { const u = (p.x + W / 2) / W * covCv.width, v = (p.z + D / 2) / D * covCv.height; i ? covCtx.lineTo(u, v) : covCtx.moveTo(u, v); }); covCtx.closePath(); covCtx.fill(); }
  covTex.needsUpdate = true;
  for (const p of S.plots) {
    if (pass.got.has(p.id)) continue; const m = plotMarks[p.id];
    if (quads.some((q) => quadContains(q, m.g.position.x, m.g.position.z))) {
      pass.got.add(p.id);
      const t = addTag(`${p.id.replace('Corn-', 'Plot ')} · photo taken`, m.top.clone().add(new THREE.Vector3(0, 0.9, 0)), 'cap', () => select(p.id)); capTags.push(t);
    }
  }
  if (k >= 1) endPass(true);
}
$('t-pass').onclick = () => pass ? endPass(false) : startPass();
$('t-cams').onclick = () => { if (pass) endPass(false); setCams(nCams === 1 ? 3 : 1); };
setCams(1);

// ---------- views ----------
let anim = null;
function flyTo(p, t, ms = 1300) { anim = { p0: camera.position.clone(), t0: controls.target.clone(), p, t, start: performance.now(), ms: reduced ? 0 : ms }; }
const VIEWS = {
  field: { p: new THREE.Vector3(38, 52, 76), t: new THREE.Vector3(0, 0, 3) },
  over: { p: new THREE.Vector3(22, 22, 32), t: new THREE.Vector3(0, 1, 0) },
};
const viewBtns = ['v-field', 'v-over', 'v-cam', 'v-splat'];
const pressView = (id) => viewBtns.forEach((b) => $(b).setAttribute('aria-pressed', String(b === id)));
function goView(v) {
  pressView('v-' + v); camera.fov = 40; camera.updateProjectionMatrix();
  if (v === 'field') { if (day !== '040') setDay('040'); flyTo(VIEWS.field.p, VIEWS.field.t, 1700); }
  if (v === 'over') flyTo(VIEWS.over.p, VIEWS.over.t);
  if (v === 'cam') { pivot.visible = true; $('t-pivot').setAttribute('aria-pressed', 'true'); camTag.hidden = towerTag.hidden = false; const cw = camWorld(); camera.fov = 41; camera.updateProjectionMatrix(); flyTo(cw.clone().addScaledVector(fwd, 0.15), cw.clone().addScaledVector(fwd, 6)); }
}
$('v-field').onclick = () => goView('field');
$('v-over').onclick = () => goView('over');
$('v-cam').onclick = () => goView('cam');
$('t-pivot').onclick = () => { endPass(false); pivot.visible = !pivot.visible; $('t-pivot').setAttribute('aria-pressed', String(pivot.visible)); camTag.hidden = towerTag.hidden = !pivot.visible; };

// ---------- guided tour ----------
const TOUR = [
  { t: 'A real corn field, rebuilt in 3D', x: 'Everything you see on the ground was rebuilt from drone photos of a real field on survey day 40. The whole surveyed field is about 57 by 67 metres.', go: () => { stopPlay(); endPass(false); setCams(1); setDay('040'); mode = 'photo'; applyMode(); select(null, false); goView('field'); } },
  { t: 'Six plots, measured by hand', x: 'The detailed section in the middle holds six plots where people measured height and leaf area on the same days the drone flew. They are our ground truth.', go: () => goView('over') },
  { t: 'Where PivotCam would sit', x: 'A camera on the pivot span, tilted 35° down, sees a strip of canopy a few metres ahead. The span, towers and camera are drawn models; the yellow outline is what the camera would see.', go: () => goView('cam') },
  { t: 'One pass of the pivot', x: 'As the span moves, each camera sweeps a strip and photographs the plots it passes. One camera covers only a strip, so this run uses the 3-camera what-if. A simulation on top of the real field.', go: () => { setCams(3); startPass(); } },
  { t: 'The whole season', x: 'Twelve flights from bare soil to full height. Colored by measured crop height on one fixed scale, the field fills in from pale to deep green.', go: () => { if (pass) endPass(false); mode = 'height'; setDay('007').then(() => { goView('over'); startPlay(); }); } },
  { t: 'Checked against a tape measure', x: 'Photo height tracks hand measurements across the season (66 plot visits, R² 0.95) and reads about 15 cm low. It cannot yet rank plots within one date. The chart on the right has the details.', go: () => { stopPlay(); side.scrollTop = 0; select(null, false); setTimeout(() => side.querySelector('.card')?.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }), 50); } },
  { t: 'Evidence for each plot', x: 'Click any plot to see its numbers for the date on screen, its growth curve, and the original photo. Crop condition stays "not assessed" until a method is tested.', go: () => { mode = 'photo'; endPass(false); setDay('040').then(() => select('Corn-3')); } },
];
let tourI = -1;
function showTour(i) {
  tourI = i; const s = TOUR[i]; const el = $('tour'); el.hidden = false;
  el.innerHTML = `<div class="eyebrow">Guided tour · ${i + 1} of ${TOUR.length}</div><h3>${s.t}</h3><p>${s.x}</p><div class="row"><button id="tq">Exit</button><span style="display:flex;gap:8px">${i ? '<button id="tp">Back</button>' : ''}<button class="pri" id="tn">${i + 1 < TOUR.length ? 'Next' : 'Finish'}</button></span></div>`;
  $('tq').onclick = endTour; if (i) $('tp').onclick = () => showTour(i - 1);
  $('tn').onclick = () => i + 1 < TOUR.length ? showTour(i + 1) : endTour();
  s.go();
}
function endTour() { tourI = -1; $('tour').hidden = true; }
$('t-tour').onclick = () => showTour(0);

renderer.domElement.addEventListener('pointerdown', () => { anim = null; });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('dlg').open) { if (tourI >= 0) endTour(); else select(null); } });

function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const v = new THREE.Vector3();
function frame(now) {
  if (anim) { const k = anim.ms ? Math.min(1, (now - anim.start) / anim.ms) : 1; const e = k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2; camera.position.lerpVectors(anim.p0, anim.p, e); controls.target.lerpVectors(anim.t0, anim.t, e); if (k >= 1) anim = null; }
  if (pass) passFrame(now);
  camTagV.copy(camWorld()).add(new THREE.Vector3(0, 0.55, 0)); towerTagV.set(X_A, PIPE_Y + 0.6, SPAN_Z + pivot.position.z);
  sky.position.copy(camera.position);
  controls.update(); renderer.render(scene, camera);
  const r = renderer.domElement.getBoundingClientRect();
  for (const t of tags) { v.copy(t.v3).project(camera); const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05; t.el.style.display = vis && !t.el.hidden ? '' : 'none'; t.el.style.left = ((v.x + 1) / 2 * r.width) + 'px'; t.el.style.top = ((1 - v.y) / 2 * r.height) + 'px'; }
  requestAnimationFrame(frame);
}
step('Ready');
camera.position.copy(VIEWS.field.p).multiplyScalar(1.6); controls.target.copy(VIEWS.field.t);
await setDay('040');
select(null);
requestAnimationFrame(frame);
$('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 650);
flyTo(VIEWS.over.p, VIEWS.over.t, reduced ? 0 : 3200); pressView('v-over');
</script>
